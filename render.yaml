# ============================================================
#  Gastos Generales · despliegue en Render
#
#  1. Subí este proyecto a un repositorio de GitHub.
#  2. En Render: New → Web Service → elegir ese repositorio.
#     (Render va a leer este archivo y crear el servicio solo.)
#  3. Completá las variables marcadas con "sync: false" en el
#     panel de Environment del servicio:
#        APP_PASSWORD · BOT_CLAVE · TELEGRAM_BOT_TOKEN
#     (TELEGRAM_CHAT_ID es opcional pero MUY recomendable: es
#      con lo que el bot te puede avisar/restaurar si el
#      servidor pierde los datos. Tu ID de chat te lo muestra
#      el bot con /start si todavía no está vinculado.)
#  4. Deploy. Cuando termine, entrá a la URL pública con tu
#     contraseña y seguí el README para vincular tu número.
# ============================================================
services:
  - type: web
    name: gastos-generales
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/salud
    envVars:
      - key: NODE_VERSION
        value: 20
      # Se completan a mano en el panel de Environment de Render
      - key: APP_PASSWORD
        sync: false
      - key: BOT_CLAVE
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Recomendado: aviso y restauración de respaldos por Telegram
      - key: TELEGRAM_CHAT_ID
        sync: false
      # URL de este mismo servicio: es la que Telegram va a llamar
      - key: PUBLIC_URL
        fromService:
          type: web
          name: gastos-generales
          property: hostUrl

# ------------------------------------------------------------
#  ¿Y los datos en el plan gratis?
#
#  Render borra el disco en cada reinicio o redeploy. Por eso el
#  servidor manda una copia de seguridad a tu chat de Telegram
#  como archivo .json (con cambios, como mucho cada 6 h; al
#  apagarse; y cuando pedís /respaldo).
#
#  Si el servidor pierde los datos:
#   a) Abrí el dashboard desde un navegador que ya los tenga:
#      los sube solo.
#   b) Reenviá al bot el último archivo gastos-respaldo-….json
#      del chat: lo restaura al instante.
#   c) Copia de más: "⬇︎ Descargar respaldo" en el dashboard.
# ------------------------------------------------------------
