# ============================================================
#  Gastos Generales · despliegue en Render
#
#  1. Subí este proyecto a un repositorio de GitHub.
#  2. En Render: New → Web Service → elegir ese repositorio.
#     (Render va a leer este archivo y crear el servicio solo.)
#  3. Completá las variables marcadas con "sync: false" en el
#     panel de Environment del servicio:
#        APP_PASSWORD · BOT_CLAVE · TELEGRAM_BOT_TOKEN
#  4. IMPORTANTE (disco persistente): el disco gratis de Render
#     se borra en cada reinicio. Este archivo ya declara
#     "disk" + DATA_FILE, pero para que Render lo aplique:
#        a) Subí el plan del servicio a uno de pago
#           (Dashboard → tu servicio → Plan/Change Plan).
#        b) Si el servicio ya existe, agregá el disco a mano:
#           Dashboard → tu servicio → Disk → Add Disk
#           mountPath: /var/data · sizeGB: 1
#           (o recreá el servicio desde este render.yaml).
#        c) Verificá que exista la variable DATA_FILE
#           = /var/data/estado.json
#  5. Deploy. Cuando termine, entrá a la URL pública con tu
#     contraseña y seguí el README para vincular tu número.
#     Telegram no necesita ningún cambio: el bot sigue igual.
# ============================================================
services:
  - type: web
    name: gastos-generales
    runtime: node
    plan: starter
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/salud
    disk:
      name: gastos-datos
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 20
      # Se completan a mano en el panel de Environment de Render
      - key: APP_PASSWORD
        sync: false
      - key: BOT_CLAVE
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      # Datos y caché de OCR viven en el disco persistente
      - key: DATA_FILE
        value: /var/data/estado.json
      - key: TESSERACT_CACHE
        value: /var/data/ocr
      # URL de este mismo servicio: es la que Telegram va a llamar
      - key: PUBLIC_URL
        fromService:
          type: web
          name: gastos-generales
          property: hostUrl

# ------------------------------------------------------------
#  Nota sobre persistencia
#
#  El disco persistente guarda el archivo de datos (DATA_FILE)
#  y la caché de OCR entre reinicios y deploys, y Render toma
#  una instantánea automática cada 24 h (se restaura desde el
#  panel → Disk → Snapshots).
#
#  Aun así, conviene usar de vez en cuando el botón
#  "⬇︎ Descargar respaldo" del dashboard: el .json se restaura
#  con "⬆︎ Restaurar" y sirve como copia fuera de la nube.
# ------------------------------------------------------------
