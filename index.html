<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gastos Generales · Control del hogar</title>
<style>
:root{
  --bg:#f4f6fb; --panel:#ffffff; --panel-2:#f9fafc;
  --ink:#111a2e; --ink-2:#4a5568; --ink-3:#8a94a6;
  --line:#e5e9f2; --line-2:#eef1f7;
  --brand:#4f46e5; --brand-2:#6d5efc; --brand-soft:#eeecfe;
  --ok:#0f9d58; --ok-soft:#e6f6ee;
  --warn:#e8a200; --warn-soft:#fdf4e0;
  --bad:#e0393f; --bad-soft:#fdecec;
  --sidebar:#141a2e; --sidebar-2:#1b2240;
  --radius:14px; --shadow:0 1px 2px rgba(17,26,46,.05),0 8px 24px -12px rgba(17,26,46,.18);
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--font);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
a{color:var(--brand)}
h1,h2,h3,h4{margin:0;font-weight:700;letter-spacing:-.02em}
.mono{font-variant-numeric:tabular-nums}

/* ---------- Layout ---------- */
.app{display:flex;min-height:100vh}
.sidebar{width:238px;flex:0 0 238px;background:linear-gradient(180deg,var(--sidebar),var(--sidebar-2));color:#c9cfe4;padding:18px 14px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:6px}
.brandbox{display:flex;align-items:center;gap:10px;padding:8px 10px 16px}
.brandlogo{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand),#9b5cf6);display:grid;place-items:center;font-size:17px;box-shadow:0 6px 16px -6px #6d5efc}
.brandname{color:#fff;font-weight:700;font-size:14.5px;letter-spacing:-.02em;line-height:1.15}
.brandname small{display:block;color:#7c86a8;font-weight:500;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase}
.navbtn{display:flex;align-items:center;gap:11px;padding:9px 11px;border-radius:10px;color:#aeb7d2;font-weight:500;font-size:13.5px;width:100%;text-align:left;transition:.14s;position:relative}
.navbtn:hover{background:rgba(255,255,255,.06);color:#fff}
.navbtn.on{background:linear-gradient(90deg,rgba(109,94,252,.35),rgba(109,94,252,.1));color:#fff}
.navbtn.on::before{content:"";position:absolute;left:-14px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--brand-2)}
.navbtn .ic{width:18px;text-align:center;font-size:15px}
.navbtn .badge{margin-left:auto;background:var(--bad);color:#fff;font-size:10.5px;font-weight:700;border-radius:99px;padding:1px 6px;min-width:18px;text-align:center}
.sidenav-foot{margin-top:auto;padding:12px 10px;border-top:1px solid rgba(255,255,255,.08);font-size:11.5px;color:#7c86a8}
.sidenav-foot b{color:#c9cfe4}

.main{flex:1;min-width:0;padding:22px 26px 60px}
.pagehead{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.pagehead h1{font-size:21px}
.pagehead .sub{color:var(--ink-3);font-size:13px;margin-top:3px}
.headtools{display:flex;gap:9px;flex-wrap:wrap;align-items:center}

/* ---------- Controls ---------- */
.btn{display:inline-flex;align-items:center;gap:7px;padding:8px 13px;border-radius:9px;font-weight:600;font-size:13px;background:#fff;border:1px solid var(--line);color:var(--ink-2);transition:.14s;box-shadow:0 1px 1px rgba(17,26,46,.03)}
.btn:hover{border-color:#cfd6e6;color:var(--ink);transform:translateY(-1px)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 6px 16px -8px var(--brand)}
.btn.primary:hover{background:#443cdb;color:#fff}
.btn.ghost{background:transparent;box-shadow:none}
.btn.danger{color:var(--bad);border-color:#f5c9ca;background:var(--bad-soft)}
.btn.sm{padding:5px 9px;font-size:12px;border-radius:8px}
.btn.solid-danger{background:var(--bad);border-color:var(--bad);color:#fff}
.seg{display:inline-flex;background:#eceffb;border-radius:10px;padding:3px;gap:2px}
.seg button{padding:5px 12px;border-radius:8px;font-size:12.5px;font-weight:600;color:var(--ink-3)}
.seg button.on{background:#fff;color:var(--brand);box-shadow:0 1px 3px rgba(17,26,46,.12)}
select.ctl,input.ctl,textarea.ctl{background:#fff;border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:13px;outline:none;transition:.14s;min-width:0}
select.ctl:focus,input.ctl:focus,textarea.ctl:focus{border-color:var(--brand-2);box-shadow:0 0 0 3px rgba(109,94,252,.15)}
textarea.ctl{width:100%;resize:vertical;line-height:1.55}
label.f{display:block;font-size:11.5px;font-weight:600;color:var(--ink-3);text-transform:uppercase;letter-spacing:.05em;margin-bottom:5px}
.field{margin-bottom:13px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:11px}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:11px}

/* ---------- Cards ---------- */
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.card .cbody{padding:16px 18px}
.card .chead{padding:13px 18px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:12px}
.card .chead h3{font-size:14px}
.grid-kpi{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:15px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.kpi .lab{font-size:11.5px;color:var(--ink-3);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.kpi .val{font-size:25px;font-weight:800;letter-spacing:-.035em;margin-top:6px}
.kpi .note{font-size:12px;color:var(--ink-3);margin-top:3px}
.kpi .strip{position:absolute;left:0;top:0;bottom:0;width:3px}
.grid-2{display:grid;grid-template-columns:1.15fr .85fr;gap:15px;margin-bottom:15px}
.grid-2b{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin-bottom:15px}

/* ---------- Table ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13.2px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:700;padding:9px 12px;background:var(--panel-2);border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:10px 12px;border-bottom:1px solid var(--line-2);vertical-align:middle}
.tbl tbody tr:hover{background:#fafbfe}
.tbl .num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.totalrow td{background:var(--panel-2);font-weight:700;border-top:2px solid var(--line);border-bottom:none}
.tbl tr.subrow td{background:#fbfcff;color:var(--ink-2)}
.tbl tr.subrow:hover{background:#f6f8ff}
.tblwrap{overflow-x:auto;border-radius:var(--radius)}
.catdot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:8px;flex:0 0 auto}
.catcell{display:flex;align-items:center;gap:0;font-weight:600}
.expander{width:22px;height:22px;border-radius:6px;background:#eef1f7;color:var(--ink-3);display:grid;place-items:center;font-size:10px;margin-right:8px;flex:0 0 auto;transition:.14s}
.expander:hover{background:#e2e7f2;color:var(--ink)}
.expander.open{background:var(--brand-soft);color:var(--brand);transform:rotate(90deg)}

/* progress */
.prog{height:7px;border-radius:99px;background:#edf0f7;overflow:hidden;min-width:74px}
.prog i{display:block;height:100%;border-radius:99px;transition:width .35s}
.prog.ok i{background:linear-gradient(90deg,#28c76f,#0f9d58)}
.prog.warn i{background:linear-gradient(90deg,#ffc046,#e8a200)}
.prog.bad i{background:linear-gradient(90deg,#ff6b6f,#e0393f)}
.prog.none i{background:#c3cbdc}
.mini{font-size:11.5px;color:var(--ink-3);margin-top:3px;font-variant-numeric:tabular-nums}

/* pills */
.pill{display:inline-flex;align-items:center;gap:5px;padding:2.5px 8px;border-radius:99px;font-size:11.5px;font-weight:600;background:#eef1f7;color:var(--ink-2);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:#0b7a45}
.pill.warn{background:var(--warn-soft);color:#96660a}
.pill.bad{background:var(--bad-soft);color:#b32a2f}
.pill.brand{background:var(--brand-soft);color:var(--brand)}
.chip{display:inline-flex;align-items:center;gap:6px;background:#f2f4fa;border:1px solid var(--line);border-radius:8px;padding:4px 7px;font-size:12.2px;margin:0 5px 5px 0}
.chip button{color:var(--ink-3);font-size:13px;line-height:1;padding:0 1px}
.chip button:hover{color:var(--bad)}

/* ---------- Donut ---------- */
.donutbox{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:6px 0}
.donut{position:relative;flex:0 0 auto}
.donut .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center;pointer-events:none}
.donut .center b{display:block;font-size:20px;font-weight:800;letter-spacing:-.03em}
.donut .center span{font-size:11px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.legend{flex:1;min-width:200px;display:flex;flex-direction:column;gap:5px;max-height:270px;overflow:auto}
.legrow{display:flex;align-items:center;gap:8px;font-size:12.6px;padding:3px 5px;border-radius:7px;cursor:pointer}
.legrow:hover{background:var(--panel-2)}
.legrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.legrow .vv{font-weight:700;font-variant-numeric:tabular-nums}
.legrow .pp{color:var(--ink-3);width:47px;text-align:right;font-variant-numeric:tabular-nums}

/* ---------- Alerts ---------- */
.alert{display:flex;gap:11px;align-items:flex-start;padding:11px 13px;border-radius:11px;border:1px solid;margin-bottom:9px}
.alert .ai{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:14px;flex:0 0 auto}
.alert.warn{background:var(--warn-soft);border-color:#f6e3b4;color:#7a5305}
.alert.warn .ai{background:#ffe9b8}
.alert.bad{background:var(--bad-soft);border-color:#f7cdce;color:#8f2126}
.alert.bad .ai{background:#ffd5d6}
.alert.ok{background:var(--ok-soft);border-color:#cbeada;color:#0a6b3e}
.alert.ok .ai{background:#cdefdc}
.alert .atx{flex:1;min-width:0;font-size:13px}
.alert .atx b{display:block;font-size:13.4px;margin-bottom:2px}
.empty{text-align:center;padding:34px 18px;color:var(--ink-3)}
.empty .ei{font-size:34px;margin-bottom:8px;opacity:.7}
.empty b{display:block;color:var(--ink-2);font-size:14.5px;margin-bottom:3px}

/* ---------- Modal ---------- */
.scrim{position:fixed;inset:0;background:rgba(15,20,38,.55);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:22px;z-index:70}
.scrim.on{display:flex}
.modal{background:#fff;border-radius:16px;width:100%;max-width:620px;max-height:90vh;overflow:auto;box-shadow:0 30px 70px -20px rgba(0,0,0,.5);animation:pop .18s ease}
.modal.wide{max-width:940px}
@keyframes pop{from{transform:translateY(12px) scale(.98);opacity:0}to{transform:none;opacity:1}}
.mhead{padding:16px 20px;border-bottom:1px solid var(--line-2);display:flex;align-items:center;justify-content:space-between;gap:12px;position:sticky;top:0;background:#fff;border-radius:16px 16px 0 0;z-index:2}
.mhead h3{font-size:16px}
.mhead .x{width:30px;height:30px;border-radius:8px;background:#f2f4fa;color:var(--ink-2);font-size:17px;line-height:1}
.mhead .x:hover{background:#e6eaf4}
.mbody{padding:18px 20px}
.mfoot{padding:14px 20px;border-top:1px solid var(--line-2);display:flex;justify-content:flex-end;gap:9px;position:sticky;bottom:0;background:#fff;border-radius:0 0 16px 16px}

/* ---------- Toast ---------- */
#toasts{position:fixed;right:18px;bottom:18px;display:flex;flex-direction:column;gap:9px;z-index:99;max-width:390px}
.toast{background:#111a2e;color:#fff;padding:11px 14px;border-radius:11px;font-size:13px;box-shadow:0 14px 34px -12px rgba(0,0,0,.55);animation:slide .25s ease;display:flex;gap:9px;align-items:flex-start;border-left:3px solid var(--brand-2)}
.toast.ok{border-left-color:#28c76f}.toast.warn{border-left-color:#ffc046}.toast.bad{border-left-color:#ff6b6f}
@keyframes slide{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}

/* ---------- Import ---------- */
.drop{border:2px dashed #cfd6ea;border-radius:13px;padding:22px;text-align:center;color:var(--ink-3);background:#fafbff;transition:.15s;cursor:pointer}
.drop:hover,.drop.over{border-color:var(--brand-2);background:var(--brand-soft);color:var(--brand)}
.drop .di{font-size:26px}
.drop b{display:block;color:var(--ink-2);margin:6px 0 2px;font-size:14px}
.tabs2{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:15px}
.tabs2 button{padding:9px 14px;font-size:13.4px;font-weight:600;color:var(--ink-3);border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs2 button.on{color:var(--brand);border-bottom-color:var(--brand)}
.tag{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:5px}
.tag.new{background:var(--brand-soft);color:var(--brand)}
.tag.dup{background:#eef1f7;color:var(--ink-3)}
.tag.skip{background:var(--warn-soft);color:#96660a}
.tag.ocr{background:#e7f2ff;color:#1c62a8}
.srcbox{background:var(--panel-2);border:1px solid var(--line-2);border-radius:9px;padding:9px 11px;font-size:12.3px;color:var(--ink-2);white-space:pre-wrap;word-break:break-word;max-height:76px;overflow:auto}
.progbar{height:5px;background:#edf0f7;border-radius:99px;overflow:hidden}
.progbar i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));transition:width .3s}

/* ---------- Category manager ---------- */
.catrow{border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:#fff;overflow:hidden}
.catrow .top{display:flex;align-items:center;gap:11px;padding:11px 14px}
.catrow .top:hover{background:#fbfcff}
.catrow .nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:9px;flex:1;min-width:0}
.catrow .lim{font-size:12.3px;color:var(--ink-3);white-space:nowrap}
.catrow .lim b{color:var(--ink-2)}
.catrow .acts{display:flex;gap:6px}
.catrow .detail{padding:0 14px 13px;border-top:1px dashed var(--line);padding-top:11px;background:#fcfdff}
.switch{width:36px;height:20px;border-radius:99px;background:#d3d9e8;position:relative;transition:.18s;flex:0 0 auto;cursor:pointer}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.18s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch.on{background:var(--brand)}
.switch.on::after{transform:translateX(16px)}
.searchwrap{position:relative}
.searchwrap input{padding-left:31px;width:230px}
.searchwrap .si{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3);font-size:13px}
.hint{font-size:12.2px;color:var(--ink-3);line-height:1.5}
.hint b{color:var(--ink-2)}
.notice{background:var(--brand-soft);border:1px solid #dcd8fd;border-radius:11px;padding:11px 13px;font-size:12.8px;color:#3f37b3;line-height:1.5}
.notice.warn{background:var(--warn-soft);border-color:#f6e3b4;color:#7a5305}
.legendtags{display:flex;gap:7px;flex-wrap:wrap;margin-top:9px}
.mtdot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px}

.mobilebar{display:none}

@media (max-width:1080px){.grid-2{grid-template-columns:1fr}.grid-kpi{grid-template-columns:repeat(2,1fr)}}
@media (max-width:860px){
  .sidebar{position:fixed;left:0;top:0;z-index:60;transform:translateX(-100%);transition:.22s}
  .sidebar.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.4)}
  .mobilebar{display:flex;align-items:center;gap:11px;background:var(--sidebar);color:#fff;padding:11px 15px;position:sticky;top:0;z-index:50}
  .mobilebar .mm{font-size:20px;color:#fff}
  .main{padding:16px 14px 50px}
  .grid-2b,.row2,.row3{grid-template-columns:1fr}
  .grid-kpi{grid-template-columns:1fr 1fr}
}
@media (max-width:560px){.grid-kpi{grid-template-columns:1fr}.headtools{width:100%}.searchwrap input{width:100%}.searchwrap{flex:1}}
</style>
</head>
<body>
<div class="mobilebar"><button class="mm" id="mmenu">☰</button><div style="font-weight:700">Gastos Generales</div></div>
<div class="app">
  <aside class="sidebar" id="sidebar">
    <div class="brandbox">
      <div class="brandlogo">💸</div>
      <div class="brandname">Gastos Generales<br><small>Control del hogar</small></div>
    </div>
    <button class="navbtn on" data-view="dashboard"><span class="ic">📊</span> Dashboard</button>
    <button class="navbtn" data-view="gastos"><span class="ic">🧾</span> Gastos</button>
    <button class="navbtn" data-view="importar"><span class="ic">📱</span> Importar WhatsApp</button>
    <button class="navbtn" data-view="categorias"><span class="ic">🏷️</span> Categorías</button>
    <button class="navbtn" data-view="alertas"><span class="ic">🔔</span> Alertas <span class="badge" id="navBadge" style="display:none">0</span></button>
    <div class="sidenav-foot">
      <div id="footCount">Sin gastos cargados</div>
      <div style="margin-top:5px">Datos guardados en <b>este equipo</b></div>
    </div>
  </aside>

  <main class="main">
    <section id="view-dashboard" class="view"></section>
    <section id="view-gastos" class="view" style="display:none"></section>
    <section id="view-importar" class="view" style="display:none"></section>
    <section id="view-categorias" class="view" style="display:none"></section>
    <section id="view-alertas" class="view" style="display:none"></section>
  </main>
</div>

<div class="scrim" id="scrim"><div class="modal" id="modal"></div></div>
<div id="toasts"></div>

<script>
'use strict';
/* =========================================================
   0. UTILIDADES
   ========================================================= */
const $ = (s,r=document)=>r.querySelector(s);
const $$ = (s,r=document)=>[...r.querySelectorAll(s)];
const esc = s => String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const norm = s => String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ').trim();
/* Igual que norm() pero respetando los espacios inicial/final de las palabras clave
   (así “entrada ” o “spa ” no matchean dentro de “entradas” o “españa”). */
const normSp = s => String(s??'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/\s+/g,' ');
const nfMoney = new Intl.NumberFormat('es-AR',{minimumFractionDigits:0,maximumFractionDigits:2});
const nfPct = new Intl.NumberFormat('es-AR',{minimumFractionDigits:0,maximumFractionDigits:1});
const money = n => (n<0?'-$':'$')+nfMoney.format(Math.abs(Number(n)||0));
const pct = n => nfPct.format(Number(n)||0)+'%';
const MES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESL = ['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const hoyISO = ()=>{const d=new Date();return d.toISOString().slice(0,10)};
const mesDe = iso => (iso||'').slice(0,7);
const etiquetaMes = m => { const [a,mm]=m.split('-'); return MESL[(+mm)-1]+' '+a; };
function fechaLarga(iso){ if(!iso) return '—'; const [a,m,d]=iso.split('-'); return `${+d} ${MES[+m-1]} ${a}`; }
function fechaCorta(iso){ if(!iso) return '—'; const [a,m,d]=iso.split('-'); return `${d}/${m}/${a}`; }
function rangoMes(m){ const [a,mm]=m.split('-').map(Number); const ini=new Date(a,mm-1,1); return [ini.toISOString().slice(0,10), new Date(a,mm,0).toISOString().slice(0,10)]; }

function toast(msg,type='ok',ms=4200){
  const t=document.createElement('div'); t.className='toast '+type;
  t.innerHTML = `<span>${type==='ok'?'✅':type==='warn'?'⚠️':'⛔'}</span><div>${msg}</div>`;
  $('#toasts').appendChild(t);
  setTimeout(()=>{t.style.transition='.3s';t.style.opacity='0';t.style.transform='translateX(30px)';setTimeout(()=>t.remove(),320)},ms);
}

/* =========================================================
   1. ESTRUCTURA DE CATEGORÍAS (semilla)
   ========================================================= */

/* =========================================================
   2. ESTADO Y PERSISTENCIA
   ========================================================= */
const KEY='gastosGenerales.v1';
let S = null;
/* MODO: 'local'  = datos en este navegador (archivo abierto con doble clic)
        'remoto' = el servidor de la nube es la fuente de verdad (Telegram + navegador comparten datos) */
let MODO='local';
let _syncT=null, _syncErr=false;

function defaults(){
  return { v:1, cats:seedCategorias(), exps:[], cfg:{ warnPct:80, moneda:'ARS' }, _borrados:[] };
}
function normalizar(o){
  const s = (o && typeof o==='object' && !Array.isArray(o)) ? o : {};
  if(!Array.isArray(s.cats) || !s.cats.length) s.cats = defaults().cats;
  if(!Array.isArray(s.exps)) s.exps = [];
  if(!s.cfg || typeof s.cfg!=='object') s.cfg = {warnPct:80, moneda:'ARS'};
  if(!Array.isArray(s._borrados)) s._borrados = [];
  if(!s.v) s.v = 1;
  return s;
}
function load(){
  try{
    const raw = localStorage.getItem(KEY);
    S = raw ? normalizar(JSON.parse(raw)) : normalizar(null);
    if(!raw) save();
  }catch(e){ console.warn(e); S = normalizar(null); }
}
function save(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ if(MODO!=='remoto') toast('No se pudo guardar. El almacenamiento del navegador está lleno.','bad',8000); }
  if(MODO==='remoto' && !_silencio) sincronizar();
}
/* Registra bajas para que el servidor no las "resucite" al fusionar estados */
function borrarGastos(ids){
  const set=new Set(ids), corte=Date.now()-14*864e5;
  S.exps = S.exps.filter(e=>!set.has(e.id));
  S._borrados = (S._borrados||[]).filter(b=>b.ts>corte).concat(ids.map(id=>({id, ts:Date.now()}))).slice(-500);
}

/* ---------------- Sincronización con el servidor ---------------- */
function sincronizar(inmediato){
  if(MODO!=='remoto' || typeof fetch!=='function') return;
  clearTimeout(_syncT);
  const enviar=async()=>{
    try{
      const r=await fetch('/api/estado',{method:'PUT',credentials:'same-origin',
        headers:{'Content-Type':'application/json'}, body:JSON.stringify(S)});
      if(r.status===401){ mostrarLogin(); return; }
      if(!r.ok) throw new Error('HTTP '+r.status);
      try{ const j=await r.json(); if(j && typeof j._rev==='number'){ S._rev=j._rev; localStorage.setItem(KEY, JSON.stringify(S)); } }catch(e){}
      if(_syncErr){ _syncErr=false; toast('☁️ Conexión con el servidor restablecida.','ok'); }
    }catch(e){
      if(!_syncErr){ _syncErr=true; toast('⚠️ Sin conexión con el servidor: se reintentará en el próximo cambio.','warn'); }
    }
  };
  if(inmediato) enviar(); else _syncT=setTimeout(enviar,800);
}
async function conectarServidor(){
  if(typeof fetch!=='function') return 'local';
  if(typeof location==='undefined' || !/^https?:$/.test(location.protocol||'')) return 'local';
  let r;
  try{
    const ctrl=new AbortController(), t=setTimeout(()=>ctrl.abort(),4000);
    r=await fetch('/api/estado',{credentials:'same-origin',signal:ctrl.signal});
    clearTimeout(t);
  }catch(e){ return 'local'; }
  if(r.status===401) return 'login';
  if(!r.ok) return 'local';
  try{
    const j=await r.json();
    if(!j || !Array.isArray(j.cats) || !j.cats.length) return 'local';
    S=normalizar(j); MODO='remoto';
    /* Si el servidor recién arrancó y este navegador ya tenía gastos, los sube una sola vez */
    let cache=null; try{ cache=JSON.parse(localStorage.getItem(KEY)||'null'); }catch(e){}
    if(!S.exps.length && cache && Array.isArray(cache.exps) && cache.exps.length && !(cache._borrados||[]).length){
      S=normalizar(cache); sincronizar(true);
    }else{ save(); }
    return 'remoto';
  }catch(e){ return 'local'; }
}

  if(document.getElementById('loginOverlay')) return;
  document.body.insertAdjacentHTML('beforeend', `

    <div class="modal" style="max-width:360px">

}

/* =========================================================
   3. ALERTAS DE PRESUPUESTO
   ========================================================= */
function consumoCat(cat, desde){
  const desdeISO = desde||'0000-01-01';
  return S.exps.filter(e=>e.cat===cat.id && e.date>=desdeISO).reduce((a,e)=>a+e.amount,0);
}
function estadoLimite(cat, total){
  const lim = Number(cat.limit)||0;
  if(!lim) return {p:0, level:'none', lim:0, total};
  const p = total/lim*100;
  const level = p>=100 ? 'bad' : (p>=S.cfg.warnPct ? 'warn':'ok');
  return {p, level, lim, total};
}
function generarAlertas(desde){
  const out=[];
  for(const c of S.cats){
    if(c.limit<=0) continue;
    const total = consumoCat(c, desde);
    const e = estadoLimite(c,total);
    if(e.level==='bad'){
      out.push({lvl:'bad',cat:c,txt:`Límite superado: ${c.name} lleva ${money(total)} sobre un límite de ${money(e.lim)}.`,pct:e.p,total,lim:e.lim});
    }else if(e.level==='warn'){
      out.push({lvl:'warn',cat:c,txt:`Alerta: llevás consumido el ${pct(e.p)} del presupuesto de ${c.name}.`,pct:e.p,total,lim:e.lim});
    }else if(c.alert && e.lim>0 && e.p>0){
      out.push({lvl:'ok',cat:c,txt:`${c.name}: ${money(total)} de ${money(e.lim)} (${pct(e.p)}). Todavía estás dentro del límite.`,pct:e.p,total,lim:e.lim});
    }
  }
  out.sort((a,b)=>b.pct-a.pct);
  return out;
}
/* =========================================================
   4. PARSING: importes, fechas, mensajes de WhatsApp
   ========================================================= */
function tokenAValor(tok){
  let t = String(tok).replace(/[^\d.,]/g,'');
  if(!t) return NaN;
  const lastDot=t.lastIndexOf('.'), lastCom=t.lastIndexOf(',');
  const decPos = Math.max(lastDot,lastCom);
  const sep = t[decPos];
  const decimalLen = t.length-1-decPos;
  let intPart, decPart='';
  if(decPos>0 && sep===',' && decimalLen>0 && decimalLen<=2 && !/^(\d{1,3})(,\d{3})+$/.test(t)){
    intPart=t.slice(0,decPos).replace(/[.,]/g,''); decPart=t.slice(decPos+1);
  }else if(decPos>0 && sep==='.' && decimalLen>0 && decimalLen<=2 && !/^(\d{1,3})(\.\d{3})+$/.test(t)){
    intPart=t.slice(0,decPos).replace(/[.,]/g,''); decPart=t.slice(decPos+1);
  }else if(decPos>0 && /^(\d{1,3})([.,]\d{3})+$/.test(t)){
    intPart=t.replace(/[.,]/g,''); decPart='';
  }else if(decPos>0){
    intPart=t.slice(0,decPos).replace(/[.,]/g,''); decPart=t.slice(decPos+1).replace(/[.,]/g,'');
  }else{ intPart=t; }
  const v = parseFloat((intPart||'0')+(decPart?'.'+decPart:''));
  return isNaN(v)?NaN:v;
}

function parseImporte(texto){
  const original = String(texto||'');
  /* En tickets, el "total" manda sobre cualquier otro importe de la lista */
  const tm = original.match(/\b(?:total(?:\s+(?:a\s+pagar|general|final))?|importe\s+total|suma)\s*[:$]?\s*(\$\s*)?(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)/i);
  if(tm){
    const vT = tokenAValor(tm[2]);
    const plausible = !!tm[1] || /[.,]/.test(tm[2]) || vT>=100;   /* “total 3 productos” no es un importe */
    if(plausible && !isNaN(vT) && vT>0 && vT<1e9) return Math.round(vT*100)/100;
  }
  // Fechas, horas y teléfonos nunca son importes: se blanquean antes de buscar candidatos.
  let t = original
    .replace(/\b\d{1,2}:\d{2}(?::\d{2})?\b/g,' ')
    .replace(/\b(?:20\d{2}|[12]?\d|3[01])[\/.\-](?:[01]?\d|1[0-2]|3[01])(?:[\/.\-](?:\d{2,4}))?\b/g,' ')
    .replace(/\b\d{8,}\b/g,' ');
  const cands=[];
  const re=/(\$|usd|ars|pesos?|guaran[ií]es?)?\s*(\d{1,3}(?:[.,]\d{3})+(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)(\s*(usd|d[oó]lares?|pesos?))?/gi;
  let m;
  while((m=re.exec(t))!==null){
    const raw=m[0].trim();
    const v=tokenAValor(m[2]);
    if(isNaN(v)||v<=0||v>=1e9) continue;
    const tieneSym = /\$|usd|pesos?/i.test(m[0]||'');
    const esFecha = /^\d{1,2}[\/\-]\d{1,2}([\/\-]\d{2,4})?$/.test(raw);
    const esHora  = /^\d{1,2}:\d{2}/.test(raw);
    if(esFecha||esHora) continue;
    cands.push({v, sym:tieneSym, sep:/[.,]/.test(m[2]||'')});
  }
  if(!cands.length) return null;
  const conSym = cands.filter(c=>c.sym);
  /* Sin símbolo monetario se aceptan solo importes plausibles: con separador de miles/decimales o ≥ 100
     (evita gastos inventados como “fueron 2 cafés”). */
  const plausibles = cands.filter(c=> c.sym || c.sep || c.v>=100);
  const pool = conSym.length? conSym : plausibles;
  if(!pool.length) return null;
  pool.sort((a,b)=>b.v-a.v);
  return pool[0].v;
}

function parseFecha(texto, fallback){
  const t=String(texto||'');
  let m;
  if((m=t.match(/\b(20\d{2})[-\/](0?[1-9]|1[0-2])[-\/](0?[1-9]|[12]\d|3[01])\b/)))
    return `${m[1]}-${String(m[2]).padStart(2,'0')}-${String(m[3]).padStart(2,'0')}`;
  if((m=t.match(/\b(0?[1-9]|[12]\d|3[01])[-\/](0?[1-9]|1[0-2])[-\/](\d{2,4})\b/))){
    let a=m[3]; if(a.length===2) a = (+a>70? '19':'20')+a;
    return `${a}-${String(m[2]).padStart(2,'0')}-${String(m[1]).padStart(2,'0')}`;
  }
  if(/\bayer\b/i.test(t)){ const d=new Date(Date.now()-864e5); return d.toISOString().slice(0,10); }
  if(/\bhoy\b/i.test(t)) return hoyISO();
  return fallback||hoyISO();
}

const COMERCIOS = ['coto','carrefour express','carrefour','jumbo','vea','aldi','disco','makro','walmart','changomas','dia','good market','maxiconsumo','hipermercado','farmacity','libreria','zara','falabella','open 25','open25','uber','didi','cabify','pedidos ya','rappi','spotify','netflix','disney','steam','mercado libre','amazon','aliexpress','temu','shein','ypf','shell','axion','petrobras','edenor','edesur','aysa','metrogas','osde','swiss medical','medife','personal','claro','movistar','tuenti','vodafone','airbnb','booking'];
function parseComercio(t, from){
  const n=norm(t);
  for(const c of COMERCIOS) if(n.includes(norm(c))) return c.replace(/\b\w/g,ch=>ch.toUpperCase());
  const stop=new Set(['Hola','Buenos','Buenas','Dias','Dia','Tardes','Noches','Gracias','Total','Pago','Pagado','Compra','Gasto','Fecha','Detalle','Importe','Categoria','Observacion','El','La','Los','Las','Por','Con','Para','Aviso','Mensaje','Sticker','Imagen','Documento','Adjunto','Ayer','Hoy','Cheque','Efectivo','Transferencia','Credito','Debito','Mercado']);
  const excl=new Set(norm(from||'').split(' ').filter(w=>w.length>2));
  const esNombre = w => /^[A-ZÁÉÍÓÚÑ][A-Za-zÁÉÍÓÚÑáéíóúñ&.'-]{2,}$/.test(w) && !stop.has(w) && !excl.has(norm(w));
  let _kws=null;
  /* Las palabras clave de las categorías son descriptores ("Peaje", "Farmacia"), no comercios */
  const esDescriptiva = w=>{
    if(!_kws) _kws = reglas().map(r=>r.k.trim()).filter(Boolean);
    const x=normSp(w);
    return _kws.some(k=> k===x || (x.length>4 && k.length>4 && (k.startsWith(x)||x.startsWith(k))));
  };
  const apto = w => esNombre(w) && !esDescriptiva(w);
  const txt = String(t||'');
  /* 1) Tras una preposición: "en el Coto", "con Mercado Pago" */
  const prep = txt.match(/\b(?:en|el|la|los|las|de|del|por|con|desde|hacia|para)\s+([A-ZÁÉÍÓÚÑ][\p{L}'’-]+(?:\s+[A-ZÁÉÍÓÚÑ][\p{L}'’-]+){0,2})/u);
  if(prep){ const c=prep[1].split(' ').filter(apto); if(c.length) return c.join(' '); }
  /* 2) En mayúsculas (t típico de tickets): "COTO S.A." */
  const caps = txt.match(/\b[A-ZÁÉÍÓÚÑ]{3,}(?:\s+[A-ZÁÉÍÓÚÑ]{2,})*\b/g);
  if(caps){ const c=caps.filter(apto); if(c.length) return c[0]; }
  /* 3) Nombres propios con inicial mayúscula (se saltea la primera palabra si es una oración) */
  const words = txt.split(/[\s\n|•·\-–]+/).filter(Boolean);
  const cands = words.map((w,i)=> (i===0 && words.length>=4) ? null : w).filter(apto);
  if(cands.length) return cands.slice(0,2).join(' ');
  return '';
}

function parseDetalle(texto, amount){
  let t = String(texto||'').replace(/\s+/g,' ').trim();
  t = t.replace(/(\$ ?[\d.,]+|[\d.,]{3,} ?(?:pesos|usd)?)/gi,' ');
  t = t.replace(/\b(pagado|pague|gaste|total|importe|compree|costo|transfiri|fecha)\b/gi,' ');
  t = t.replace(/[-–—|•·]+/g,' ');
  t = t.replace(/\s{2,}/g,' ').trim();
  if(t.length>90) t = t.slice(0,90).trim();
  return t || (amount!=null? 'Gasto '+money(amount) : 'Sin detalle');
}

/* ---- Encabezados de exportación de WhatsApp ---- */
function dividirMensajes(texto){
  const lines = String(texto||'').split(/\r?\n/);
  const out=[]; let cur=null; let conCabecera=false;
  /* Soporta:  12/10/26, 14:32 - Juan: texto   |   [12/10/2026, 14:32:33] Juan: texto  |  (12/10/2026 14:32) Juan: texto */
  const hdrRe = /^[\s\u200e\u200f]*[\[\(]?\s*(20\d{2}|[12]?\d|3[01])[-\/]([01]?\d|[12]\d|3[01])(?:[-\/](\d{2,4}))?[, ]+\s*(\d{1,2}:\d{2}(?::\d{2})?(?:\s?[AaPp][Mm])?)\s*[\]\)]?\s*(?:[-–—]\s*)?(.*)$/;
  const emisorRe = /^([\p{L}][\p{L}\s.'’\-]{0,38}?):\s*(.*)$/u;
  for(const ln of lines){
    const m = ln.match(hdrRe);
    if(m){
      if(cur) out.push(cur);
      conCabecera=true;
      let d,mn,y;
      if(/^\d{4}$/.test(m[1])){ y=m[1]; mn=m[2]; d=m[3]||'01'; }
      else { d=m[1]; mn=m[2]; y=m[3]; if(y&&y.length===2) y=(+y>70?'19':'20')+y; if(!y) y=new Date().getFullYear(); }
      const iso = `${y}-${String(mn).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      let rest = m[5]||'', from='';
      const sm = rest.match(emisorRe);
      if(sm && sm[1].trim() && sm[2].trim()){ from = sm[1].trim(); rest = sm[2]; }
      cur = {date:/^\d{4}-\d{2}-\d{2}$/.test(iso)?iso:null, from, text:rest, raw:ln};
    }else if(cur){
      cur.text += (cur.text?'\n':'')+ln; cur.raw += '\n'+ln;
    }else{
      cur = cur || {date:null,from:'',text:'',raw:''};
      cur.text += (cur.text?'\n':'')+ln; cur.raw += (cur.raw?'\n':'')+ln;
    }
  }
  if(cur) out.push(cur);
  return out.filter(o=>(o.raw||o.text||'').trim().length);
}

function indexarReglas(){

                ctx:(s.ctx||[]).map(normSp), not:(s.not||[]).map(normSp)});
  }
  arr.sort((a,b)=>b.len-a.len);
  return arr;
}

/* Respaldos: si el mensaje no coincide con ninguna palabra clave pero sí con
   un comercio conocido, se usa el comercio para elegir la categoría.
   Así "Coto $38.560" o "Farmacity $9.800" solos ya clasifican bien. */
const CATEGORIA_COMERCIO = {
  'coto':'Supermercado','carrefour express':'Supermercado','carrefour':'Supermercado','jumbo':'Supermercado',
  'vea':'Supermercado','aldi':'Supermercado','disco':'Supermercado','makro':'Supermercado','walmart':'Supermercado',

  'farmacity':'Salud','libreria':'Educación','zara':'Ropa y calzado','falabella':'Ropa y calzado',
  'open 25':'Paseos y salidas','open25':'Paseos y salidas','uber':'Transporte','didi':'Transporte',
  'cabify':'Transporte','pedidos ya':'Alimentación','rappi':'Alimentación','spotify':'Suscripciones',
  'netflix':'Suscripciones','disney':'Suscripciones','steam':'Suscripciones','mercado libre':'Compras',
  'amazon':'Compras','aliexpress':'Compras','temu':'Compras','shein':'Compras','ypf':'Transporte',
  'shell':'Transporte','axion':'Transporte','petrobras':'Transporte','edenor':'Servicios','edesur':'Servicios',
  'aysa':'Servicios','metrogas':'Servicios','osde':'Salud','swiss medical':'Salud','medife':'Salud',

};
/* Palabras tan comunes que no dicen nada por sí solas: si el único ganador es
   una de estas y además hay un comercio conocido, manda el comercio. */
const GENERICAS = new Set(['compra','compras','gasto','gastos','pago','pagado','consumo','total','ticket','factura','transferencia','efectivo','debito','credito']);

function clasificar(texto, comercio){
  const n = ' '+norm(texto)+' ';   /* se rellena con espacios para respetar palabras clave con espacio final */
  if(!n.trim()) return null;
  const scores = {}, matched = [];
  for(const r of reglas()){
    if(!n.includes(r.k)) continue;
    if(r.ctx && r.ctx.length && !r.ctx.some(cx=>n.includes(cx))) continue;
    if(r.not && r.not.length && r.not.some(cx=>n.includes(cx))) continue;
    const key = r.c+'|'+(r.s||'');
    scores[key] = (scores[key]||0) + r.len + 1;
    matched.push({ key, k:r.k });
  }
  let best=null, bestScore=0;
  for(const k in scores){ if(scores[k]>bestScore){ bestScore=scores[k]; best=k; } }
  /* Respaldo por comercio conocido: si no matcheó ninguna palabra clave, o si
     la única que matcheó es genérica ("compra", "pago"...), manda el comercio.
     Así "Coto $38.560" o "Compra en Farmacity $9.800" solos ya clasifican bien. */
  const destino = comercio ? CATEGORIA_COMERCIO[norm(comercio)] : null;
  const cidDestino = destino ? (S.cats.find(x=>norm(x.name)===norm(destino))||{}).id : null;
  if(cidDestino){
    const ganadoras = best ? matched.filter(m=>m.key===best) : [];
    if(!ganadoras.length || ganadoras.every(m=>GENERICAS.has(m.k))) best = cidDestino+'|';
  }
  if(!best){
    const otros = S.cats.find(c=>norm(c.name)==='otros');
    if(otros) return {cat:otros.id, sub:(otros.subs[0]||{}).id||null, score:0};
    return null;
  }
  const [cid,sid] = best.split('|');
  return {cat:cid, sub:sid||null, score:bestScore};
}

   ========================================================= */
function construirDesdeTexto(msg, orig){
  const full = String(msg.raw||msg.text||'').trim();        // texto completo (con emisor y cabecera)
  const texto = String(msg.text||'').trim() || full;         // sin el nombre de quien envió
  const date = msg.date || parseFecha(full, hoyISO());
  const amount = parseImporte(full);
  const merchant = parseComercio(texto, msg.from);
  const det = clasificar(full, merchant);
  return {
    id: uid(),
    date,
    cat: det?det.cat:null,
    sub: det?det.sub:null,
    detail: parseDetalle(texto, amount),
    amount: amount==null?null:Math.round(amount*100)/100,
    pay: parseMedio(full),
    merchant,
    notes: full.length>200? full.slice(0,200)+'…' : full,
    src: orig||'texto',
    _score: det?det.score:0,
    _raw: full
  };
}

function normalizarOCR(texto){
  let t = String(texto||'');
  t = t.replace(/\u00a0/g,' ').replace(/[|]/g,' ');
  const fixes=[[/\bO(\d)\b/g,'0$1'],[/\bI(\d)\b/g,'1$1'],[/(\d)O\b/g,'$10'],[/\bl(\d)/g,'1$1'],[/\b(\d)l\b/g,'$1']];
  for(const [a,b] of fixes) t=t.replace(a,b);
  t = t.replace(/[^\S\n]{2,}/g,' ').replace(/\n{3,}/g,'\n\n');
  return t.trim();
}

function donutSVG(items, size=210){
  const total = items.reduce((a,i)=>a+i.value,0);
  const r=78, C=2*Math.PI*r;
  if(!total) return `<svg width="${size}" height="${size}" viewBox="0 0 210 210"><circle cx="105" cy="105" r="78" fill="none" stroke="#eef1f7" stroke-width="26"/></svg>`;
  let off=0, segs='';
  items.forEach(i=>{
    const frac=i.value/total, len=Math.max(frac*C-2,0.6);
    segs+=`<circle cx="105" cy="105" r="78" fill="none" stroke="${i.color}" stroke-width="26" stroke-dasharray="${len} ${C-len}" stroke-dashoffset="${-off}" transform="rotate(-90 105 105)"><title>${esc(i.label)}: ${money(i.value)}</title></circle>`;
    off+=frac*C;
  });
  return `<svg width="${size}" height="${size}" viewBox="0 0 210 210">${segs}</svg>`;
}
function barrasMesSVG(series, w=560, h=170){
  if(!series.length) return '<div class="empty" style="padding:20px">Sin datos</div>';
  const max=Math.max(...series.map(s=>s.v),1);
  const step=(w-20)/series.length, bw=Math.min(52, step-8);
  let g='';
  series.forEach((s,i)=>{
    const x = 10 + i*step + (step-bw)/2;
    const bh = Math.max(3,(s.v/max)*(h-46));
    const y = h-26-bh;
    g+=`<rect x="${x}" y="${y}" width="${bw}" height="${bh}" rx="5" fill="${s.hoy?'#6d5efc':'#c7c9f7'}"><title>${s.l}: ${money(s.v)}</title></rect>`;
    g+=`<text x="${x+bw/2}" y="${h-9}" font-size="10.5" fill="#8a94a6" text-anchor="middle">${s.l}</text>`;
    if(s.v>0) g+=`<text x="${x+bw/2}" y="${y-5}" font-size="10" fill="#4a5568" text-anchor="middle" font-weight="600">${nfMoney.format(Math.round(s.v/1000))}k</text>`;
  });
  return `<svg width="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
function serieMensual(n=12){
  const out=[]; const [a,m]=UI.mes.split('-').map(Number);

function alertasHTML(arr){
  if(!arr.length) return '';
  return arr.map(a=>`<div class="alert ${a.lvl}">

      <div class="mini">${pct(a.pct)} consumido · límite ${money(a.lim)}</div></div>
    <div><button class="btn sm" data-editlim="${a.cat.id}">Editar límite</button></div>
  </div>`).join('');
}

function filtrarGastos(){
  const q=norm(UI.gastoQ);
  return S.exps
    .filter(e=> !UI.gastoCat || e.cat===UI.gastoCat)
    .filter(e=> !UI.gastoMedio || (e.pay||'No informado')===UI.gastoMedio)
    .filter(e=> !UI.gastoDesde || e.date>=UI.gastoDesde)
    .filter(e=> !UI.gastoHasta || e.date<=UI.gastoHasta)
    .filter(e=> !q || norm([e.detail,e.merchant,e.notes,catName(e.cat),subName(e.cat,e.sub),String(e.amount)].join(' ')).includes(q))
    .sort((a,b)=> b.date.localeCompare(a.date) || (b._ts||0)-(a._ts||0));
}
function opcionesCats(sel){
  return S.cats.map(c=>`<option value="${c.id}" ${c.id===sel?'selected':''}>${c.icon} ${esc(c.name)}</option>`).join('');
}
function opcionesSubs(cat,sel){
  const c=catById(cat); if(!c) return '';
  return c.subs.map(s=>`<option value="${s.id}" ${s.id===sel?'selected':''}>${esc(s.name)}</option>`).join('');
}

function modalGasto(id){

  openModal(`
  <div class="mhead"><h3>${e?'Editar gasto':'Nuevo gasto'}</h3><button class="x" data-close>✕</button></div>
  <div class="mbody">
    <div class="row2">
      <div class="field"><label class="f">Fecha</label><input type="date" class="ctl" id="gDate" value="${d.date}" style="width:100%"></div>
      <div class="field"><label class="f">Importe</label><input type="number" step="0.01" min="0" class="ctl" id="gAmt" value="${d.amount}" placeholder="0,00" style="width:100%"></div>
    </div>
    <div class="row2">
      <div class="field"><label class="f">Categoría</label><select class="ctl" id="gCat" style="width:100%"><option value="">Elegir…</option>${opcionesCats(d.cat)}</select></div>
      <div class="field"><label class="f">Subcategoría</label><select class="ctl" id="gSub" style="width:100%"><option value="">—</option></select></div>
    </div>
    <div class="field"><label class="f">Detalle</label><input class="ctl" id="gDet" value="${esc(d.detail)}" placeholder="Ej: compra semanal" style="width:100%"></div>
    <div class="row2">
      <div class="field"><label class="f">Medio de pago</label><select class="ctl" id="gPay" style="width:100%"><option value="">—</option>${MEDIOS_LISTA.map(m=>`<option ${m===d.pay?'selected':''}>${m}</option>`).join('')}</select></div>
      <div class="field"><label class="f">Comercio</label><input class="ctl" id="gMer" value="${esc(d.merchant)}" placeholder="Ej: Coto" style="width:100%"></div>
    </div>
    <div class="field" style="margin-bottom:0"><label class="f">Observación</label><textarea class="ctl" id="gNotes" rows="3" placeholder="Notas, cuotas, quién pagó…">${esc(d.notes)}</textarea></div>
  </div>
  <div class="mfoot">
    ${e?`<button class="btn danger" id="gDel" style="margin-right:auto">🗑 Eliminar</button>`:''}
    <button class="btn" data-close>Cancelar</button>
    <button class="btn primary" id="gSave">${e?'Guardar cambios':'Guardar gasto'}</button>
  </div>`);

  const fillSubs=()=>{ $('#gSub').innerHTML='<option value="">—</option>'+opcionesSubs($('#gCat').value, d.sub); };
  $('#gCat').onchange=fillSubs; fillSubs();

  $('#gSave').onclick=()=>{
    const amt=parseFloat(String($('#gAmt').value).replace(',','.'));
    if(!$('#gCat').value){ toast('Elegí una categoría para guardar el gasto.','warn'); $('#gCat').focus(); return; }
    if(isNaN(amt)||amt<=0){ toast('Ingresá un importe válido.','warn'); $('#gAmt').focus(); return; }
    const rec={
      id: e? e.id : uid(),
      date: $('#gDate').value||hoyISO(),
      cat: $('#gCat').value,
      sub: $('#gSub').value||null,
      detail: $('#gDet').value.trim()||'Gasto',
      amount: Math.round(amt*100)/100,
      pay: $('#gPay').value,
      merchant: $('#gMer').value.trim(),
      notes: $('#gNotes').value.trim(),
      src: e? e.src:'manual',
      _ts: Date.now()
    };
    if(e){ const i=S.exps.findIndex(x=>x.id===e.id); S.exps[i]=rec; } else S.exps.push(rec);
    save(); closeModal(); render();
    chequearAlertaGuardada(rec, e? 'actualizado':'guardado');

  $('#gDel') && ($('#gDel').onclick=()=>{ if(e){eliminarGasto(e.id); closeModal();} });

function chequearAlertaGuardada(rec, accion){
  const c=catById(rec.cat); if(!c||!c.limit){ toast(`Gasto ${accion}: ${money(rec.amount)} en ${esc(catName(rec.cat))}.`); return; }
  const [ini]=rangoMes(rec.date.slice(0,7));
  const total=consumoCat(c, ini);
  const e=estadoLimite(c,total);
  if(e.level==='bad') toast(`Límite superado: <b>${esc(c.name)}</b> lleva ${money(total)} sobre un límite de ${money(e.lim)}.`,'bad',7000);
  else if(e.level==='warn') toast(`Alerta: llevás consumido el ${pct(e.p)} del presupuesto de <b>${esc(c.name)}</b>.`,'warn',7000);
  else toast(`Gasto ${accion}: ${money(rec.amount)} en ${esc(c.name)} (${pct(e.p)} del límite).`,'ok');
}

function eliminarGasto(id){
  const e=S.exps.find(x=>x.id===id); if(!e) return;
  confirmar('Eliminar gasto', `¿Borrar <b>${esc(e.detail)}</b> de ${esc(catName(e.cat))} por <b>${money(e.amount)}</b>?`, ()=>{
    borrarGastos([id]); save(); render(); toast('Gasto eliminado.','ok');
  });
}

function exportCSV(){
  const list=filtrarGastos();
  if(!list.length){ toast('No hay gastos para exportar.','warn'); return; }
  const head=['Fecha','Categoría','Subcategoría','Detalle','Importe','Medio de pago','Comercio','Observación','Origen'];
  const q=s=>'"'+String(s??'').replace(/"/g,'""')+'"';
  const csv=[head.join(';')].concat(list.map(e=>[
    fechaCorta(e.date), catName(e.cat), subName(e.cat,e.sub), e.detail,
    String(e.amount).replace('.',','), e.pay||'', e.merchant||'', (e.notes||'').replace(/\n/g,' '), e.src||'manual'
  ].map(q).join(';'))).join('\r\n');
  const blob=new Blob(['\ufeff'+csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`gastos-${hoyISO()}.csv`; a.click(); URL.revokeObjectURL(a.href);
  toast(`Se exportaron ${list.length} gastos.`,'ok');
}

/* Respaldo: descarga un .json con todo el estado y permite volver a cargarlo.
   En modo servidor también sirve para migrar datos desde/hacia otra instalación. */
function descargarBackup(){
  try{
    const blob=new Blob([JSON.stringify(S,null,2)],{type:'application/json'});
    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='gastos-generales-'+hoyISO()+'.json';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
    toast('Respaldo descargado.','ok');
  }catch(e){ toast('No se pudo descargar el respaldo.','bad'); }
}
function restaurarBackup(file){
  const rd=new FileReader();
  rd.onerror=()=>toast('No se pudo leer el archivo.','bad');
  rd.onload=()=>{
    let j=null;
    try{ j=JSON.parse(rd.result); }catch(e){}
    if(!j || !Array.isArray(j.cats) || !Array.isArray(j.exps)) return toast('El archivo no parece un respaldo válido.','bad');
    confirmar('Restaurar respaldo',
      `Se reemplazarán tus <b>${S.exps.length}</b> gastos actuales por los <b>${j.exps.length}</b> del archivo <b>${esc(file.name)}</b>.`,
      ()=>{
        /* marca los actuales como borrados para que el servidor no los resucite */
        S=normalizar(Object.assign({}, j, { _borrados:(j._borrados||[]).concat(S.exps.map(e=>({id:e.id, ts:Date.now()}))).slice(-500) }));
        UI.mes=mesDe(hoyISO());
        save(); render(); toast('Respaldo restaurado.','ok');
      });
  };
  rd.readAsText(file);
}

function esDup(e, lista){
  const base = S.exps.some(x=> x.date===e.date && e.amount>0 && Math.abs(x.amount-(e.amount||0))<0.01
        && norm(x.detail).slice(0,18)===norm(e.detail||'').slice(0,18));
  const enLista = lista.some(x=> x!==e && x.date===e.date && x.amount>0 && Math.abs((x.amount||0)-(e.amount||0))<0.01
        && norm(x.detail).slice(0,18)===norm(e.detail||'').slice(0,18));
  return base||enLista;
}

function analizarTexto(text, src){
  const msgs = dividirMensajes(text);
  const drafts=[]; const saltados=[];
  for(const m of msgs){
    const raw=(m.raw||m.text||'').trim();
    if(!raw) continue;
    if(esOtraCosa(raw)){ saltados.push({raw, motivo:'Contiene “otra cosa”: no se incluye en esta aplicación.'}); continue; }
    const d = construirDesdeTexto(m, src);
    if(d.amount==null){ saltados.push({raw, motivo:'No se pudo identificar el importe en el mensaje.'}); continue; }
    if(!d.cat){ saltados.push({raw, motivo:'Sin categoría asignada.'}); continue; }
    drafts.push(d);
  }
  drafts.forEach(d=>{ d._st = esDup(d, drafts) ? 'dup':'nuevo'; });
  UI.drafts = drafts; UI.saltados = saltados;
  return {drafts, saltados};
}

/* Persiste los gastos analizados y devuelve los registros guardados.
   Es la misma rutina que usa el servidor cuando llega un comprobante desde el celular. */
function persistirDrafts(drafts){
  const guardados=[];
  (drafts||[]).filter(x=>x._st==='nuevo' && x.amount>0 && x.cat).forEach(x=>{
    const rec={ id:uid(), date:x.date||hoyISO(), cat:x.cat, sub:x.sub||null, detail:x.detail||'Gasto',
      amount:x.amount, pay:x.pay||'', merchant:x.merchant||'', notes:x.notes||'', src:x.src||'texto', _ts:Date.now() };
    S.exps.push(rec); guardados.push(rec);
  });
  if(guardados.length) save();
  return guardados;
}

function guardarDrafts(){
  const nuevos=(UI.drafts||[]).filter(x=>x._st==='nuevo' && x.amount>0 && x.cat);
  if(!nuevos.length){ toast('No hay gastos nuevos para guardar.','warn'); return; }
  const guardados=persistirDrafts(nuevos);
  const porCat={};
  guardados.forEach(rec=>{ porCat[rec.cat]=(porCat[rec.cat]||0)+rec.amount; });
  const mensajes=[]; const [ini]=rangoMes(UI.mes);
  for(const cid in porCat){
    const c=catById(cid); if(!c||!c.limit) continue;
    const tot=consumoCat(c,ini); const e=estadoLimite(c,tot);
    if(e.level==='bad'){ mensajes.push(`<b>${esc(c.name)}</b>: Límite superado, llevás ${money(tot)} sobre un límite de ${money(e.lim)}.`); }
    else if(e.level==='warn'){ mensajes.push(`<b>${esc(c.name)}</b>: llevás consumido el ${pct(e.p)} del presupuesto.`); }
  }
  UI.drafts=[]; UI.saltados=[];
  /* Si los gastos importados caen fuera del mes que se estaba viendo, salta al mes correspondiente */
  const masReciente = nuevos.reduce((m,x)=> (x.date && x.date>m) ? x.date : '', '');
  if(masReciente && !nuevos.some(x=> (x.date||'').slice(0,7)===UI.mes)) UI.mes = masReciente.slice(0,7);
  render();
  if(mensajes.length) toast(`Se guardaron ${guardados.length} gasto(s).<br>${mensajes.join('<br>')}`,'bad',9000);
  else toast(`Se guardaron ${guardados.length} gasto${guardados.length>1?'s':''} correctamente.`,'ok');
}

/* ---- carga de archivos: OCR + PDF ---- */
function cargarScript(url){
  return new Promise((res,rej)=>{
    if(document.querySelector(`script[src="${url}"]`)) return res();
    const s=document.createElement('script'); s.src=url; s.onload=res;
    s.onerror=()=>rej(new Error('No se pudo descargar la librería (¿sin conexión?)'));
    document.head.appendChild(s);
  });
}
function procMsg(t,p){
  const bar=$('#impProcBar'), tx=$('#impProcTxt'), pc=$('#impProcPct');
  if(tx) tx.textContent=t;
  if(bar&&p!=null) bar.style.width=Math.round(p*100)+'%';
  if(pc&&p!=null) pc.textContent=Math.round(p*100)+'%';
}
async function procesarArchivos(files){
  UI.impTab='archivo'; render();
  const proc=$('#impProc'); if(proc) proc.style.display='block';
  let textos=[], hay=false;
  for(let i=0;i<files.length;i++){
    const f=files[i];
    procMsg(`Leyendo ${f.name}…`, 0);
    try{
      if(f.type.startsWith('image/')){ textos.push(await ocrImagen(f,i,files.length)); hay=true; }
      else if(f.type==='application/pdf' || /\.pdf$/i.test(f.name)){ textos.push(await pdfATexto(f,i,files.length)); hay=true; }
      else { textos.push(await f.text()); hay=true; }
    }catch(err){
      console.error(err);
      toast(`No se pudo leer <b>${esc(f.name)}</b>: ${esc(err.message||err)}. Podés cargar el gasto manualmente.`,'bad',7000);
    }
  }
  if(proc) proc.style.display='none';
  if(!hay){ render(); return; }
  /* Cada archivo se analiza por separado (una foto/PDF = un comprobante) */
  const drafts=[], saltados=[];
  textos.forEach(t=>{
    const r=analizarTexto(t,'ocr');
    drafts.push(...r.drafts); saltados.push(...r.saltados);
  });
  drafts.forEach(x=>{ x._st = esDup(x, drafts) ? 'dup':'nuevo'; });
  UI.drafts = drafts; UI.saltados = saltados;
  render();
  if(drafts.length) toast(`Lectura terminada: ${drafts.length} gasto(s) clasificados${saltados.length?` y ${saltados.length} descartados`:''}. Revisá y guardá.`,'ok',6000);
  else toast('No se identificaron importes en el archivo. Revisá el texto detectado o cargá el gasto manualmente.','warn',7000);
}

async function ocrImagen(file, idx, total){
  await cargarScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
  if(!window.Tesseract) throw new Error('OCR no disponible sin conexión');
  const res = await window.Tesseract.recognize(file, 'spa+eng', {
    logger: m => {
      if(m.status==='recognizing text') procMsg(`Reconociendo texto de ${file.name} (imagen ${idx+1}/${total})…`, m.progress);
      else procMsg(m.status+'…', m.progress||0);
    }
  });
  const t = normalizarOCR(res.data.text||'');
  const box=$('#impDrop');
  if(box) box.insertAdjacentHTML('afterbegin',
    `<div class="srcbox" style="margin-top:10px;text-align:left"><b>Texto detectado en ${esc(file.name)}:</b>\n${esc(t.slice(0,1200))||'(vacío)'}</div>`);
  return t;
}

async function pdfATexto(file, idx, total){
  await cargarScript('https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.min.js');
  const lib = window.pdfjsLib; if(!lib) throw new Error('Lector de PDF no disponible sin conexión');
  lib.GlobalWorkerOptions.workerSrc='https://cdn.jsdelivr.net/npm/pdfjs-dist@3.11.174/build/pdf.worker.min.js';
  const buf = await file.arrayBuffer();
  const pdf = await lib.getDocument({data:buf}).promise;
  const out=[];
  for(let p=1;p<=pdf.numPages;p++){
    procMsg(`Leyendo página ${p} de ${pdf.numPages} de ${file.name}…`, (p-1)/pdf.numPages);
    const page = await pdf.getPage(p);
    const tc = await page.getTextContent();
    let txt = tc.items.map(i=>i.str).join(' ').replace(/\s+/g,' ').trim();
    if(txt.replace(/\s/g,'').length < 25){
      const vp = page.getViewport({scale:2});
      const cv = document.createElement('canvas'); cv.width=vp.width; cv.height=vp.height;
      const ctx = cv.getContext('2d'); ctx.fillStyle='#fff'; ctx.fillRect(0,0,cv.width,cv.height);
      await page.render({canvasContext:ctx, viewport:vp}).promise;
      try{
        await cargarScript('https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js');
        const r = await window.Tesseract.recognize(cv,'spa+eng',{logger:m=>{ if(m.status==='recognizing text') procMsg(`OCR de la página ${p}/${pdf.numPages}…`, m.progress); }});
        txt = r.data.text||txt;
      }catch(e){ /* se conserva el texto escaso */ }
    }
    out.push(normalizarOCR(txt));
  }
  procMsg('Terminado',1);
  return out.join('\n');
}

  setInterval(refrescarServidor, 30000);
  document.addEventListener('visibilitychange', ()=>{ if(!document.hidden) refrescarServidor(); });
}

document.addEventListener('DOMContentLoaded', async ()=>{
  const modo = await conectarServidor();   /* 'remoto' | 'login' | 'local' */
  if(modo!=='remoto') load();
  initEventos();
  go('dashboard');
  if(modo==='login') mostrarLogin();
});
</script>
</body>
</html>
